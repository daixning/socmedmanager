name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the committed app/debug.keystore (still one stable key)."
          fi

      - name: Unit tests (pure Kotlin logic)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SocMedManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SocMedManager-apk
          path: dist/SocMedManager.apk
          if-no-files-found: error

      - name: Upload compile reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            core/build/reports
